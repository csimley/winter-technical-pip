<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Antler Winter Technical Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f3f5;--surface:#ffffff;--ink:#1c2128;--muted:#59626e;--rule:#d6dae0;
  --red:#b3141d;--red-ink:#ffffff;--soft:#f7e2e3;--amber:#a5660c;--done:#1c2128;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13161a;--surface:#1c2026;--ink:#eceef1;--muted:#a3acb7;--rule:#323840;
    --red:#e8474e;--red-ink:#ffffff;--soft:#3a1c1f;--amber:#e3a33a;--done:#eceef1;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13161a;--surface:#1c2026;--ink:#eceef1;--muted:#a3acb7;--rule:#323840;
  --red:#e8474e;--red-ink:#ffffff;--soft:#3a1c1f;--amber:#e3a33a;--done:#eceef1;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 "Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:18px 18px 150px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:10px;font:700 23px/1 "Barlow Condensed","Arial Narrow",sans-serif}
.mark i{display:block;width:10px;height:26px;background:var(--red);border-radius:2px}
.pos{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
select{font:500 15px "Barlow",system-ui,sans-serif;color:var(--ink);background:var(--surface);border:1.5px solid var(--rule);border-radius:6px;padding:7px 10px}
.tabs{display:flex;gap:2px;margin:16px 0 0;border-bottom:2px solid var(--rule);overflow-x:auto}
.tab{background:none;border:0;padding:10px 12px;font:600 16px "Barlow",system-ui,sans-serif;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
h1.date{font:700 clamp(42px,11vw,68px)/.92 "Barlow Condensed","Arial Narrow",sans-serif;margin:22px 0 8px;letter-spacing:-.005em}
.kick{margin:0;font-weight:600;font-size:18px}
.sub{margin:2px 0 0;color:var(--muted)}
.status{margin:14px 0 0;padding:10px 14px;background:var(--soft);border-left:4px solid var(--red);border-radius:0 6px 6px 0;font-weight:500}
.strip{display:grid;grid-template-columns:34px repeat(13,minmax(0,1fr));gap:3px;margin:22px 0 4px}
.strip .lab{font:600 13px/1 "Barlow Condensed",sans-serif;color:var(--muted);display:flex;align-items:center}
.strip .wk{font:600 13px/1 "Barlow Condensed",sans-serif;color:var(--muted);text-align:center;padding-bottom:3px}
.cell{aspect-ratio:1;min-height:18px;border:1.5px solid var(--rule);background:var(--surface);border-radius:3px;padding:0;cursor:pointer;position:relative}
.cell.done{background:var(--done);border-color:var(--done)}
.cell.today{border-color:var(--red);border-width:2.5px}
.cell.sel{background:var(--red);border-color:var(--red)}
.cell.test::after{content:"";position:absolute;right:2px;top:2px;width:5px;height:5px;border-radius:50%;background:var(--amber)}
.phases{display:grid;grid-template-columns:34px repeat(13,minmax(0,1fr));gap:3px;margin-bottom:6px}
.phases span{font:600 12px/1.1 "Barlow Condensed",sans-serif;color:var(--muted);border-top:2px solid var(--rule);padding-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{font-size:13px;color:var(--muted);margin:0 0 8px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin:0 4px 0 10px}
.legend b:first-child{margin-left:0}
.block{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;padding:20px 0;border-top:1px solid var(--rule)}
.block:first-of-type{margin-top:12px}
.rail .n{font:700 36px/1 "Barlow Condensed",sans-serif;color:var(--red)}
.rail .m{font-size:13px;color:var(--muted);margin-top:4px}
.block h3{font:700 25px/1.08 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 6px}
.block .focus{display:inline-block;font-size:14px;font-weight:600;color:var(--red);margin:0 0 4px}
.rx{font-weight:600;margin:0 0 8px}
.block p{margin:0 0 8px}
.block ol,.block ul{margin:6px 0 10px;padding-left:22px}
.block li{margin:3px 0}
.cues{border-left:3px solid var(--rule);padding:2px 0 2px 12px;margin:8px 0 12px}
.cues div{margin:2px 0}
.note{font-size:15px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.btn{font:600 15px "Barlow",system-ui,sans-serif;padding:9px 14px;border-radius:6px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.check{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--red)}
.picker{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.log{margin:22px 0 0;padding:20px;background:var(--surface);border:1px solid var(--rule);border-radius:8px}
.log h2{font:700 26px/1.1 "Barlow Condensed",sans-serif;margin:0 0 6px}
.log p{margin:0 0 6px}
.prose h2{font:700 30px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;margin:30px 0 8px}
.prose h3{font:700 21px/1.15 "Barlow Condensed",sans-serif;margin:18px 0 4px}
.prose p{margin:0 0 12px;max-width:68ch}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px;margin:8px 0 14px;font-size:16px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--rule)}
th{font:600 15px "Barlow",sans-serif;color:var(--muted)}
td.tier{font:700 19px "Barlow Condensed",sans-serif}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:8px;vertical-align:-1px;border:1px solid var(--rule)}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;background:var(--ink);color:var(--bg);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}
.timer.on{display:block}
.timer.work{background:var(--red);color:var(--red-ink)}
.timer.cue{background:#ffffff;color:#000000}
.tin{max-width:760px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center}
.tt{font-size:14px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp{font:700 22px/1.1 "Barlow Condensed",sans-serif}
.clock{font:700 50px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.tbtns{display:flex;flex-direction:column;gap:6px}
.tbtns button{font:600 14px "Barlow",sans-serif;padding:6px 12px;border-radius:5px;border:1.5px solid currentColor;background:transparent;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.timer :focus-visible{outline-color:currentColor}
@media (max-width:420px){.block{grid-template-columns:40px minmax(0,1fr);gap:10px}.rail .n{font-size:30px}.strip,.phases{grid-template-columns:28px repeat(13,minmax(0,1fr));gap:2px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="mark"><i aria-hidden="true"></i>Antler Winter Technical Program</div>
    <label class="pos">Position
      <select id="pos">
        <option value="">Choose</option>
        <option value="central">Central (CB, CM, AM, ST)</option>
        <option value="wide">Wide (wingers, outside backs)</option>
      </select>
    </label>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="session" aria-selected="true">Session</button>
    <button class="tab" role="tab" data-view="plan" aria-selected="false">How it works</button>
    <button class="tab" role="tab" data-view="tests" aria-selected="false">Tests and juggling club</button>
  </nav>
  <main id="main"></main>
</div>

<div class="timer" id="timer" role="region" aria-label="Interval timer">
  <div class="tin">
    <div><div class="tt" id="tTitle"></div><div class="tp" id="tPhase"></div></div>
    <div class="clock" id="tClock">0:00</div>
    <div class="tbtns"><button id="tPause" type="button">Pause</button><button id="tStop" type="button">Close</button></div>
  </div>
</div>

<script>

/* Coach: optional demo videos, keyed like "tue-3" or "thu-4" (https links only). */
const DEMOS = {"mon-1":"https://www.youtube.com/watch?v=D1fzbTaXUz8","mon-2":"https://www.youtube.com/watch?v=carTOij1P7g","mon-3":"https://www.youtube.com/watch?v=VJtavpOhK6s","mon-4":"https://www.youtube.com/watch?v=JlPfNgGNbqw","mon-5":"https://www.youtube.com/watch?v=xJGHMjrHU3c","mon-6":"https://www.youtube.com/watch?v=I9D0iJxrvQU","mon-7":"https://www.youtube.com/watch?v=bmih3V54v6Y","mon-8":"https://www.youtube.com/watch?v=8xfWkNLdVYE","mon-9":"https://www.youtube.com/watch?v=-De9EQ0xZmQ","mon-10":"https://www.youtube.com/watch?v=phYwvJLMfS0","mon-11":"https://www.youtube.com/watch?v=2q6-vP_jE6I","mon-12":"https://www.youtube.com/watch?v=XeKNARcJ6Wo","mon-13":"https://www.youtube.com/watch?v=quDH7EgDWRI","tue-1":"https://www.youtube.com/watch?v=Z-3WzTcS0Xk","tue-2":"https://www.youtube.com/watch?v=dyHOunNH30M","tue-3":"https://www.youtube.com/watch?v=_xek5HWdI7g","tue-4":"https://www.youtube.com/watch?v=M7BZBXWBpoM","tue-5":"https://www.youtube.com/watch?v=ZA8Ktd6l-PI","tue-6":"https://www.youtube.com/watch?v=7z0GQ0IC6u8","tue-7":"https://www.youtube.com/watch?v=6dcW1VhK3Yw","tue-8":"https://www.youtube.com/watch?v=7nFvh7ITZm8","tue-9":"https://www.youtube.com/shorts/pkfoz--LZsM","tue-10":"https://www.youtube.com/watch?v=FqDfXbgyJdg","tue-11":"https://www.youtube.com/watch?v=lEaIPPTLPP0","tue-12":"https://www.youtube.com/watch?v=TPHEzk__jbQ","tue-13":"https://www.youtube.com/watch?v=NkLIHc4zHdE","thu-1":"https://www.youtube.com/watch?v=XDtFycaf6sk","thu-2":"https://www.youtube.com/watch?v=tptS44T2_Lc","thu-3":"https://www.youtube.com/watch?v=YpuAC0whCY4","thu-4":"https://www.youtube.com/watch?v=RbHfV-R4UAc","thu-5":"https://www.youtube.com/watch?v=Gms0BBPdGiY","thu-6":"https://www.youtube.com/watch?v=_xek5HWdI7g","thu-7":"https://www.youtube.com/watch?v=L978KcAfZAo","thu-8":"https://vimeo.com/74923160","thu-9":"https://www.youtube.com/watch?v=RmmWrETzWfA","thu-10":"https://www.youtube.com/watch?v=Gms0BBPdGiY","thu-11":"https://www.youtube.com/watch?v=RbHfV-R4UAc","thu-12":"https://www.youtube.com/watch?v=YpuAC0whCY4"};

const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAYNAMES={Mon:"Monday",Tue:"Tuesday",Thu:"Thursday"};
const DAYS=[["Mon",0],["Tue",1],["Thu",3]];
const TESTS=["W01 Mon","W07 Mon","W13 Thu"];
const SESSIONS=[];
for(let w=1;w<=13;w++){for(const [d,off] of DAYS){
  const dt=new Date(2026,10,30+(w-1)*7+off);
  const code="W"+String(w).padStart(2,"0")+" "+d;
  SESSIONS.push({i:SESSIONS.length,w,d,code,date:dt,label:code+" ("+MONTHS[dt.getMonth()]+" "+dt.getDate()+")"});
}}
const phaseOf=w=>w<=4?1:w<=8?2:w<=12?3:4;
const PHASES={
  1:{name:"Foundation",note:"Clean technique at 60–75% speed. Slow is fine; sloppy is not."},
  2:{name:"Speed",note:"Same skills, faster. Every rep finishes with an explosive escape."},
  3:{name:"Game speed",note:"Random cues and the clock. You react instead of rehearse."},
  4:{name:"Prove it",note:"Best-of sessions, then final testing on Thursday."}
};
const THEMES={Mon:"First touch",Tue:"1v1: square up, sell, escape",Thu:"Turns, position work and juggling"};

/* ---------- Content ---------- */
const WARM={
  1:{rx:"8 × 30 s on, 15 s off",timer:{work:30,rest:15,rounds:8},items:[
    "Toe taps: alternate soles on top of the ball, stay on your toes",
    "Bells: inside-inside between your feet",
    "Sole roll across with your right foot",
    "Sole roll across with your left foot",
    "Pull-push, right: pull back with the sole, push forward with the laces",
    "Pull-push, left",
    "V-pulls: pull back with the sole, push out at an angle with the inside of the same foot; alternate feet",
    "Outside-inside: small outside touch, then inside touch with one foot (right 15 s, left 15 s)"]},
  2:{rx:"8 × 30 s on, 15 s off",timer:{work:30,rest:15,rounds:8},items:[
    "Toe taps while circling all the way around the ball",
    "Croquetas in place: inside of one foot to inside of the other",
    "L-pull, right: pull back with the sole, push behind your standing leg with the inside of the same foot",
    "L-pull, left",
    "Pull-push outside: pull back with the sole, push away with the outside of the same foot; alternate feet",
    "Sole stop and go: roll forward, stop it dead, explode two touches with the outside",
    "Scissors in place, alternating feet",
    "Your three favorite patterns, as fast as clean allows"]},
  3:{rx:"8 × 30 s on, 15 s off, random-cue mode",timer:{work:30,rest:15,rounds:8,random:true},note:"Same patterns as the Speed phase. On every double beep, explode with two outside-foot touches away, then come straight back into the pattern.",items:[
    "Toe taps circling the ball","Croquetas in place","L-pull, right","L-pull, left",
    "Pull-push outside, alternating","Sole stop and go","Scissors in place","Your three favorite patterns"]}
};

const MON=[null,
 {name:"Across the body",text:"Pass into the wall, let the ball run across your body and receive it with the foot farther from the ball. First touch goes out to the side, then pass with that foot. Next rep goes the other way.",cues:["Open your hips before the ball arrives","Receive with the far foot","First touch lands 1–2 feet out in front, never under you","The ball never stops dead"]},
 {name:"Outside-foot cushion",text:"Receive with the outside of the foot nearest the ball and steer it away from an imaginary defender on that side, then pass with the other foot.",cues:["Toe down and turned in","Contact on the pinky-toe side","Touch goes away from pressure, not back into it"]},
 {name:"Sole stop and play",text:"Stop the return with your sole, roll it one step to the side, pass. Second half of each set: sole-roll it straight into space without stopping it first.",cues:["Sole on top of the ball, heel down","Roll it to where your next pass leaves from","Hips over the ball"]},
 {name:"Out of the air",text:"Throw the ball off the wall so it comes back in the air, or toss it 10+ feet straight up. Kill it with your laces, thigh or inside of the foot so it drops within one step, then pass it back.",cues:["Get under the flight early","Pull the surface down as the ball arrives","Relaxed ankle, not stiff"]},
 {name:"Holiday mixtape",text:"One set each of across the body, outside cushion, sole stop and out of the air. Grade yourself 1–5 on each. Your lowest grade gets a fifth set.",cues:["Honest grades","Write the lowest one in your log notes"]},
 {name:"Receive on the half-turn",text:"Stand side-on so you can see the wall and the open room. Receive with your back foot and take your first touch forward past a marker 2 yards to the side, as if you just turned to face goal.",cues:["Shoulder check before every pass hits the wall","Hips open to the space, not square to the wall","First touch goes forward, not sideways"]},
 {name:"Half-turn, weak side first",text:"Same as last week, but every set starts on your weak side. After testing, two sets each way.",cues:["Weak side gets the same speed","Check, open, forward"]},

 {name:"Weak-foot Monday",text:"Everything with your weaker foot: receive, touch and pass. Set 1 across the body, set 2 outside cushion, set 3 sole, then half-turn for the rest.",cues:["Slow the pass down if you have to, but never switch feet","Strong-foot standard on every touch"]},
 {name:"Scan and choose",text:"Markers 3 yards behind you on each side. Before every return, check over a shoulder and pick a side; your first touch turns you that way, two touches out, come back. In random-cue mode, a double beep means that side just got blocked: turn the other way.",cues:["Check before the ball hits the wall, not after","Decide early, touch once, go"]},
 {name:"Speed rounds",text:"Short rounds against the clock. Odd sets two-touch, even sets one-touch. Count passes that hit the wall and beat your number from the last speed set you did.",cues:["Stay on your toes","Pass with the inside, firm and low"],rx:"8 × 30 s, 15 s rest",timer:{work:30,rest:15,rounds:8}},
 {name:"Best of",text:"Pick the two Monday touches that felt worst this winter. Two sets each.",cues:["Work on the weakness, not the favorite"]}
];
const MON_RX={1:["4 sets × 2 min, 30 s rest. Stand 3–4 yards from the wall; switch your starting foot each set.",{work:120,rest:30,rounds:4}],
  2:["4 × 2 min, 30 s rest, 5–6 yards from the wall. Pass harder, receive faster.",{work:120,rest:30,rounds:4}],
  3:["6 × 60 s, 20 s rest at game pace. Count clean reps; log your best set in the notes.",{work:60,rest:20,rounds:6}]};
const MON_B={
 1:{name:"Gates",rx:"4 × 90 s, 30 s rest",timer:{work:90,rest:30,rounds:4},text:"Two gates (two shoes 1 yard apart), 2 yards to your left and 2 yards to your right. Pass, receive and take your first touch through a gate, dribble back, repeat. Alternate gates.",cues:["Through the gate in one touch","Look at the gate before the ball arrives"]},

  ["Sell","Hit the move. Sell it with your eyes, shoulders and hips; the defender reads your body, not the ball."],

 {name:"Shoulder drop",text:"Without touching the ball, drop your shoulder and step hard to one side. Push off that foot and take the ball the other way with the outside of your other foot.",cues:["Big step, little ball","Head and shoulder go with the fake"]},

 {name:"Holiday review",text:"Pick your two best moves from weeks 1–4. Half your reps with each, both directions.",cues:["Full speed only if it’s clean"]},

function renderPlan(){

<h2>How it works</h2>
<p>Three sessions a week, about 30 minutes each, from Monday, Nov 30 through Thursday, Feb 25. Mondays are first touch. Tuesdays are 1v1: square up, sell the fake, escape with the outside of the foot. Thursdays are turns, a block for your position, and a juggling record attempt. Every session ends with juggling.</p>

<h2>The phases</h2>

<p>The best wall is concrete or brick: a basement wall or the outside of the house. Don’t use a garage door, drywall, or anything with a window in it. No wall? A rebounder works. Otherwise use the out-of-the-air version on Mondays (toss and receive), or get someone at home to pass with you.</p>
<p>A size 4 ball or a futsal ball is easier indoors: less bounce, less noise. Ask before you start kicking a ball in the house.</p>

let T=null,ac=null,wake=null;
function audio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();}catch(e){ac=null;}}
function beep(f,d,times){if(!ac)return;times=times||1;for(let k=0;k<times;k++){try{const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+k*(d+0.07);o.type="square";o.frequency.value=f;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.22,t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+d+0.02);}catch(e){}}}
function wakeOn(){try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(w=>{wake=w}).catch(()=>{});}catch(e){}}
function wakeOff(){try{if(wake)wake.release();}catch(e){}wake=null;}
function startTimer(cfg,title){
  stopTimer();audio();wakeOn();
  T={work:cfg.work,rest:cfg.rest,rounds:cfg.rounds,random:!!cfg.random,title,round:1,phase:"ready",end:performance.now()+5000,paused:false,rem:0,nextCue:0,lastSec:null,iv:null};

  $("#tPause").textContent="Pause";
  $("#timer").classList.add("on");
  T.iv=setInterval(tick,100);tick();
}
function tick(){
  if(!T||T.paused)return;
  const now=performance.now();let rem=T.end-now;
  if(T.phase==="work"&&T.random&&now>=T.nextCue&&rem>1500){cue();T.nextCue=now+3000+Math.random()*4000;}
  const sec=Math.ceil(rem/1000);
  if(T.phase!=="work"&&sec>0&&sec<=3&&sec!==T.lastSec)beep(660,0.08);
  T.lastSec=sec;
  if(rem<=0){
    if(T.phase==="work"){
      if(T.round>=T.rounds){finish();return;}
      T.phase="rest";T.end=now+T.rest*1000;beep(440,0.35);
    } else {
      if(T.phase==="rest")T.round++;
      T.phase="work";T.end=now+T.work*1000;T.nextCue=now+2500+Math.random()*3500;beep(990,0.25);
    }
    rem=T.end-now;
  }
  draw(Math.max(0,rem));
}
function cue(){beep(1320,0.09,2);const el=$("#timer");el.classList.add("cue");setTimeout(()=>el.classList.remove("cue"),350);}
function draw(rem){
  const s=Math.ceil(rem/1000);$("#tClock").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  const el=$("#timer");el.classList.toggle("work",T.phase==="work");
  $("#tPhase").textContent=T.phase==="ready"?"Get ready":(T.phase==="work"?"Work":"Rest")+", set "+T.round+" of "+T.rounds;
}
function finish(){clearInterval(T.iv);beep(990,0.18,3);$("#tPhase").textContent="Block done";$("#tClock").textContent="0:00";$("#timer").classList.remove("work");T.done=true;wakeOff();}
function stopTimer(){if(T&&T.iv)clearInterval(T.iv);T=null;$("#timer").classList.remove("on","work","cue");wakeOff();}
$("#tStop").addEventListener("click",stopTimer);
$("#tPause").addEventListener("click",()=>{
  if(!T||T.done)return;
  if(!T.paused){T.paused=true;T.rem=T.end-performance.now();$("#tPause").textContent="Resume";}
  else{T.paused=false;T.end=performance.now()+T.rem;$("#tPause").textContent="Pause";}
});

render();
</script>
</body>
</html>
